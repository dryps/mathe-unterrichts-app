name: GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6

      - name: Node.js einrichten
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Bestehende Tests ausführen
        run: npm test

      - name: Laufzeitressourcen und Zustände prüfen
        run: |
          npm run test:smoke
          npm run test:visual
          npm run test:area-visual
          npm run test:circumcircle-visual
          npm run test:incircle-visual
          npm run test:unique-visual
          npm run test:number-line-visual
          npm run test:order-visual
          npm run test:absolute-visual
          npm run test:addition-visual
          npm run test:subtraction-visual
          npm run test:multiplication-visual
          npm run test:terms-visual
          npm run test:like-terms-visual
          npm run test:term-multiplication-visual
          npm run test:term-division-visual
          npm run test:bracket-sign-visual
          npm run test:distribution-visual
          npm run test:equivalence-visual
          npm run test:both-sides-visual
          npm run test:negative-inequality-visual
          npm run test:solution-set-visual
          npm run test:quadrilateral-properties-visual
          npm run test:quadrilateral-house-visual
          npm run test:quadrilateral-angle-sum-visual
          npm run test:unique-quadrilateral-visual
          npm run test:assignment-representations-visual
          npm run test:proportional-comparison-visual
          npm run test:proportional-rule-three-visual
          npm run test:inverse-assignment-visual
          npm run test:model-choice-visual
          npm run test:percentage-share-visual
          npm run test:absolute-relative-visual

      - name: Kontrolliertes Pages-Artefakt bauen
        run: npm run build:pages

      - name: Pages-Artefakt verifizieren
        run: npm run test:pages

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: GitHub Pages bereitstellen
        id: deployment
        uses: actions/deploy-pages@v4
