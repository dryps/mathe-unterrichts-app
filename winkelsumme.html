<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f7fb" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Mathe im Unterricht" />
    <meta
      name="description"
      content="Interaktive Veranschaulichung der Winkelsumme im Dreieck."
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./navigation.css" />
    <title>Warum bleiben es immer 180°?</title>
  </head>
  <body>
    <main class="app-shell">
      <nav class="module-navigation" aria-label="Modulnavigation">
        <a class="module-back-link" href="./#dreiecke">← Dreiecke</a>
      </nav>

      <header class="app-header">
        <div>
          <p class="eyebrow">Dreiecke · 7. Klasse</p>
          <h1>Warum bleiben es immer 180°?</h1>
          <p class="subtitle">Winkelsumme im Dreieck</p>
        </div>
        <p class="local-note" aria-label="Datenschutzstatus">
          <span aria-hidden="true">●</span>
          lokal · ohne Speicherung
        </p>
      </header>

      <section class="visualizer" aria-labelledby="explore-title">
        <h2 id="explore-title" class="visually-hidden">
          Verändere das Dreieck und beobachte seine Innenwinkel
        </h2>

        <svg
          id="triangle-board"
          viewBox="0 0 1000 680"
          preserveAspectRatio="xMidYMid meet"
          role="img"
          aria-labelledby="board-title board-description"
        >
          <title id="board-title">Interaktives Dreieck</title>
          <desc id="board-description">
            Verschiebe die drei großen Eckpunkte. Die Innenwinkel und ihre Summe
            werden sofort neu berechnet.
          </desc>

          <rect class="board-background" x="2" y="2" width="996" height="676" rx="34" />
          <g id="angle-sectors" aria-hidden="true"></g>
          <polygon id="triangle-shape" class="triangle-shape" points="" aria-hidden="true" />
          <g id="angle-arcs" aria-hidden="true"></g>
          <g id="angle-labels" aria-hidden="true"></g>

          <g id="vertex-controls">
            <g class="vertex-control" data-index="0">
              <circle
                class="drag-hit"
                data-index="0"
                r="60"
                tabindex="0"
                role="button"
                aria-label="Eckpunkt A verschieben"
              />
              <circle class="vertex-dot vertex-a" data-index="0" r="15" aria-hidden="true" />
            </g>
            <g class="vertex-control" data-index="1">
              <circle
                class="drag-hit"
                data-index="1"
                r="60"
                tabindex="0"
                role="button"
                aria-label="Eckpunkt B verschieben"
              />
              <circle class="vertex-dot vertex-b" data-index="1" r="15" aria-hidden="true" />
            </g>
            <g class="vertex-control" data-index="2">
              <circle
                class="drag-hit"
                data-index="2"
                r="60"
                tabindex="0"
                role="button"
                aria-label="Eckpunkt C verschieben"
              />
              <circle class="vertex-dot vertex-c" data-index="2" r="15" aria-hidden="true" />
            </g>
          </g>
        </svg>

        <div class="result-panel" aria-live="polite" aria-atomic="true">
          <p class="result-label">Die Winkelsumme bleibt</p>
          <p id="angle-equation" class="angle-equation">50° + 50° + 80° = 180°</p>
        </div>

        <div class="controls">
          <p id="interaction-hint" class="interaction-hint">
            Ziehe an den drei farbigen Eckpunkten.
          </p>
          <button id="reset-button" class="reset-button" type="button">
            <span aria-hidden="true">↺</span>
            Zurücksetzen
          </button>
        </div>
      </section>

      <noscript>Für die interaktive Darstellung muss JavaScript aktiviert sein.</noscript>
    </main>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
